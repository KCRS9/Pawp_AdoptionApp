name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      working-directory: Frontend
      run: chmod +x ./gradlew && ./gradlew assembleRelease

    - name: Rename APK
      run: mv Frontend/composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk pawp-adoption-${{ github.ref_name }}.apk

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: pawp-adoption-${{ github.ref_name }}.apk
