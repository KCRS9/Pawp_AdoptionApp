name: Build APK

on:
  push:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      working-directory: Frontend
      run: chmod +x ./gradlew && ./gradlew assembleRelease

    - name: Get commit info
      id: commit
      run: |
        echo "hash=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.commit.outputs.hash }}
        release_name: APK ${{ steps.commit.outputs.date }}
        draft: false
        prerelease: false

    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Frontend/composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk
        asset_name: pawp-adoption.apk
        asset_content_type: application/vnd.android.package-archive
